# Material Design Icons, curated.
#
# 101 icons taken from the MDI 7447-icon set but baked individually so flash
# stays small: the whole set costs ~590 kB and takes the image to 82% of the app
# partition, these cost ~4 kB.
#
# The webfont is vendored next to this file instead of fetched at build time, so
# builds are offline and reproducible: @mdi/font 7.4.47 from npm, Apache 2.0,
# sha256 61e8aba5a4e981fe22cf7c8e8bcdbea00476e75c62c37f01bf7ee33361d68428.
# To refresh, bump the version and pull just the face out of the npm package:
#   docker run --rm -v "$PWD/icons:/out" -w /out node:lts sh -c \
#     'npm pack @mdi/font@7.4.47 >/dev/null && tar -xzf mdi-font-*.tgz \
#      --strip-components=2 package/fonts/materialdesignicons-webfont.ttf'
# Paths resolve against the ESPHome config dir, not this file, hence `icons/`.
#
# To add an icon, append its codepoint below and add the display name to
# `Panel Icon` in led-matrix.yaml, keeping the two lists in the same order.
# Find the codepoint at https://pictogrammers.com/library/mdi/ -- it is the
# `F....` value, written here as \U000F....
font:
  # Size 26 is the "hero" size used by the Icon scene, where the glyph has the
  # whole 32px panel to itself.
  - file: icons/materialdesignicons-webfont.ttf
    id: font_icons
    size: 26
    glyphs: &icon_glyphs # Household
      - "\U000F072A" # washing-machine
      - "\U000F0AAC" # dishwasher
      - "\U000F0176" # coffee
      - "\U000F0290" # fridge
