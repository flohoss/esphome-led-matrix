  # Size 20 is the "inline" size: the Weather and Message scenes need room above
  # a caption, and this face's worst-case ink bottom is row 18 instead of 24.
  # Same glyph list, via a YAML anchor, so adding an icon still means one edit.
  - file: icons/materialdesignicons-webfont.ttf
    id: font_icons_inline
    size: 20
    glyphs: *icon_glyphs
