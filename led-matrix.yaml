# -----------------------------------------------------------------------------
# Brightness and power
#
# Both write the same register, so they guard each other: the slider is ignored
# while the panel is off, and switching on restores the slider value.
#
# min_value 1, not 0: 0 means "off" and belongs to the switch. See README.md for
# why 1% is not 1% of light.
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: Panel Brightness
    id: panel_brightness
    icon: mdi:brightness-6
    min_value: 1
    max_value: 100
    step: 1
    unit_of_measurement: '%'
    optimistic: true
    restore_value: true
    initial_value: 50
    set_action:
      - if:
          condition:
            switch.is_on: panel_power
          then:
            - hub75.set_brightness:
                id: display_hub75_1
                brightness: !lambda return (int) (x * 255.0 / 100.0);

switch:
  - platform: template
    name: Panel Power
    id: panel_power
    icon: mdi:monitor
    optimistic: true
    # Come back on after a reboot, default to on if nothing is stored. See
    # README.md for why brightness 0 is a true off, not a black screen.
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - hub75.set_brightness:
          id: display_hub75_1
          brightness: !lambda return (int) (id(panel_brightness).state * 255.0 / 100.0);
    turn_off_action:
      - hub75.set_brightness:
          id: display_hub75_1
          brightness: 0

# -----------------------------------------------------------------------------
# HUB75 panel
#
# panel_width/panel_height describe ONE physical panel. Chaining needs
# layout_cols/layout_rows and `layout:`; PANEL_W/PANEL_H in matrix_scenes.h
# hardcode 64x32, so a chained build must change those too. Timing knobs are
# explained in README.md.
# -----------------------------------------------------------------------------
display:
  - platform: hub75
    id: display_hub75_1
    panel_height: 32
    panel_width: 64

    update_interval: 30ms
    bit_depth: 6
    double_buffer: true
    # The lambda fills the panel every frame, so the component's own clear would
    # only blank it first and then be painted over -- and costs a full
    # framebuffer clear per redraw.
    auto_clear_enabled: false

    # HUB75 pinout: R1/G1/B1 top half, R2/G2/B2 bottom half, A-E the row pair,
    # CLK/LAT/OE shift clock, latch and output enable.
    r1_pin: GPIO25
    g1_pin: GPIO26
    b1_pin: GPIO27
    r2_pin: GPIO21
    g2_pin: GPIO22
    b2_pin: GPIO32
    e_pin: GPIO18
    a_pin: GPIO23
    b_pin: GPIO19
    c_pin: GPIO5
    d_pin: GPIO17
    clk_pin: GPIO16
    lat_pin: GPIO4
    oe_pin: GPIO15

    # The renderer, ~33x/second. Only the per-frame inputs are gathered here;
    # the scenes and the text/animation state are in matrix_scenes.h.
    lambda: |-
      const Color background = esphome::panel::light_state_color(id(light_background), Color(0, 0, 0));
      const Color foreground = esphome::panel::light_state_color(id(light_text), Color(255, 255, 255));

      esphome::panel::advance_animation();

      it.fill(background);
      esphome::panel::draw_scene(it, foreground, id(panel_scene).current_option(), id(panel_text_size).current_option(),
                                 id(panel_font_weight).current_option());
