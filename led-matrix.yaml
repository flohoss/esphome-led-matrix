# =============================================================================
# LED matrix — 64x32 HUB75 panel on an ESP32. Scenes live in matrix_scenes.h.
#
# README.md covers the entity list, the three rendering rules every scene obeys,
# and the reasoning behind the non-obvious settings. Comments here only cover
# what the key itself cannot say.
# =============================================================================
esphome:
  name: led-matrix
  # Copies the header next to main.cpp and #includes it after the generated
  # globals, so the entity names in it are this file's ids.
  includes:
    - matrix_scenes.h
  on_boot:
    # The driver forces brightness 255 in its own setup at 400, discarding the
    # restored value. Re-apply at 390: after the panel, before WiFi at 250,
    # or the panel flashes at 100% on every boot.
    priority: 390
    then:
      - if:
          condition:
            switch.is_on: panel_power
          then:
            - hub75.set_brightness:
                id: display_hub75_1
                brightness: !lambda return (int) (id(panel_brightness).state * 255.0 / 100.0);
          else:
            - hub75.set_brightness:
                id: display_hub75_1
                brightness: 0

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf
    advanced:
      flash_chip: generic
      sram1_as_iram: true

logger:
  level: INFO

api:
  encryption:
    key: !secret led_matrix__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: bluetooth Fallback Hotspot
    password: !secret wifi_fallback_password

captive_portal:

# -----------------------------------------------------------------------------
# Icons — a local package with 101 curated MDI glyphs.
#
# Adding one is two edits in the same position: a codepoint in
# icons/font-icons.yaml and a name in `Panel Icon` below. The whole 7447-icon
# set would cost ~590 kB of flash; these cost ~4 kB.
# -----------------------------------------------------------------------------
packages:
  icons: !include icons/font-icons.yaml

# -----------------------------------------------------------------------------
# Colour pickers
#
# ESPHome has no colour entity type, so components/virtual_light is an RGB light
# with no hardware behind it -- the only way the API can carry a colour.
# See README.md for why restore_mode must be RESTORE_DEFAULT_ON.
# -----------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components
    components: [virtual_light]

light:
  - platform: virtual_light
    name: Background Colour
    id: light_background
    icon: mdi:palette
    restore_mode: RESTORE_DEFAULT_ON

  - platform: virtual_light
    name: Text Colour
    id: light_text
    icon: mdi:format-color-text
    restore_mode: RESTORE_DEFAULT_ON

# -----------------------------------------------------------------------------
# Time — the Clock scene formats this itself as 24-hour.
# -----------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time

# -----------------------------------------------------------------------------
# Fonts — 4 sizes x 2 weights, baked as 1-bit glyphs. See README.md.
# -----------------------------------------------------------------------------
font:
  # `glyphs:` REPLACES the default glyphset, so GF_Latin_Kernel has to be named
  # alongside it. The default set has no umlauts, so they are listed explicitly
  # (~0.3kB per font); GF_Latin_Core would work but bakes 203 extra glyphs each.
  - file: gfonts://Roboto
    id: font_small
    size: 10
    glyphsets: &latin_glyphsets
      - GF_Latin_Kernel
    glyphs: &german_glyphs
      - 'äöüßÄÖÜ'
  - file: gfonts://Roboto
    id: font_medium
    size: 14
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto
    id: font_large
    size: 20
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto
    id: font_xlarge
    size: 24
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto@black
    id: font_small_bold
    size: 10
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto@bold
    id: font_medium_bold
    size: 14
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto@bold
    id: font_large_bold
    size: 20
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  - file: gfonts://Roboto@bold
    id: font_xlarge_bold
    size: 24
    glyphsets: *latin_glyphsets
    glyphs: *german_glyphs
  # Monospace for the clock and the weather temperature, so every digit advances
  # the same em and neither twitches as values change. The colon and the degree
  # are hand-drawn: at this size the colon is a 3x3 smear and the degree a
  # ragged 6x5 blob.
  - file: gfonts://Roboto Mono@bold
    id: font_clock
    size: 20
    glyphs: '0123456789-'

# -----------------------------------------------------------------------------
# Animated art -- GIFs split into 1-bit frames at compile time.
#
# `animation.next_frame` swaps the data pointer, so `it.image()` draws with no
# work in the renderer: 128 bytes of flash per 32x32 frame, nothing in RAM.
# Frame rate comes from the interval below, not the GIF. See README.md.
# -----------------------------------------------------------------------------
image:
  # Shared settings for every sprite; each entry names only its id and file.
  - platform: animation
    defaults:
      type: BINARY
      resize: 32x32
      transparency: chroma_key
    files:
      - id: art_ghost
        file: art/ghost.gif
      - id: art_pumpkin
        file: art/pumpkin.gif
      - id: art_gift
        file: art/gift.gif
      - id: art_birthday
        file: art/birthday.gif
      - id: art_balloon
        file: art/balloon.gif
      - id: art_newyear
        file: art/newyear.gif

# Frames advance on their own timer, so tempo is independent of the 30ms redraw:
# 100ms is ~10fps, 0.4-1.2s per cycle.
interval:
  - interval: 100ms
    then:
      - animation.next_frame: art_ghost
      - animation.next_frame: art_pumpkin
      - animation.next_frame: art_gift
      - animation.next_frame: art_birthday
      - animation.next_frame: art_balloon
      - animation.next_frame: art_newyear

# -----------------------------------------------------------------------------
# Weather from Home Assistant -- any `weather.*` entity works.
#
# These entity IDs are properties of YOUR Home Assistant, not of this firmware.
# If one is wrong the device subscribes to an entity that does not exist, HA
# sends nothing, and the scene hides its icon -- see README.md for the log line.
#
# `internal: true` keeps both out of Home Assistant; they are inputs, not
# controls.
# -----------------------------------------------------------------------------
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.beethovenstrasse
    internal: true
    on_value:
      then:
        - component.update: display_hub75_1

sensor:
  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.vscotho1_72_outside_temperature
    internal: true
    on_value:
      then:
        - component.update: display_hub75_1

# -----------------------------------------------------------------------------
# Runtime controls
#
# Optimistic + restore_value: changes apply immediately and survive a reboot.
# The switch uses restore_mode instead. `component.update` forces an immediate
# redraw instead of waiting up to 30ms, removing the lag while typing.
# -----------------------------------------------------------------------------
text:
  # Latin-1 is baked, so umlauts and accents work; anything else is dropped at
  # render time with a "Codepoint ... not found" warning.
  - platform: template
    name: Panel Message
    id: display_text
    optimistic: true
    restore_value: true
    initial_value: Hello!
    mode: text
    on_value:
      then:
        - component.update: display_hub75_1

  # The Sensor scene's caption and value. Push both from Home Assistant -- any
  # sensor, no reflash:
  #
  #   - action: text.set_value
  #     target: {entity_id: text.led_matrix_sensor_value}
  #     data: {value: '21.5'}
  - platform: template
    name: Panel Sensor Label
    id: panel_sensor_label
    icon: mdi:tag-text
    optimistic: true
    restore_value: true
    initial_value: Temperature
    mode: text
    on_value:
      then:
        - component.update: display_hub75_1

  - platform: template
    name: Panel Sensor Value
    id: panel_sensor_value
    icon: mdi:chart-line
    optimistic: true
    restore_value: true
    initial_value: '--'
    mode: text
    on_value:
      then:
        - component.update: display_hub75_1

